[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micropython-async-mqtt-client"
version = "0.1.0"
description = "Lightweight asyncio MQTT 3.1.1 client with standalone asynchronous DNS resolver"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Project contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: Implementation :: MicroPython", "Topic :: Internet"]

[tool.setuptools]
packages = ["async_mqtt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
